version: '3.11'
services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    env_file: ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    entrypoint: /django
    volumes:
      - .:/app
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
    env_file: ".env"

volumes:
  postgres_data: